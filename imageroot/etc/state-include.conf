#
# AdGuard Home state/backup include patterns for Restic
# Syntax reference: https://pkg.go.dev/path/filepath#Glob
# Restic --files-from: https://restic.readthedocs.io/en/stable/040_backup.html#including-files
# Only lines starting with "state/" or "volumes/" are considered by NS8.
#

# Admin password and DNS listen addresses of the module.
state/adguard.json
# The AdGuard Home configuration: filters, user rules, upstreams, clients,
# rewrites and access lists.
state/conf/AdGuardHome.yaml
# Custom filter lists added as local files. Downloaded filters, the query
# log and the statistics are not backed up: AdGuard Home downloads the
# filters again, and the logs only cover recent queries.
volumes/adguard-work/userfilters
