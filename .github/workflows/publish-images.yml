name: "Publish images"

on:
  push:
  workflow_dispatch:

permissions:
  packages: write
  actions: read
  contents: write
  security-events: write

concurrency:
  group: publish-suite-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A pushed tag whose image already exists, such as the release tag that
  # publish-catalog-version creates, must not rebuild and replace the tested
  # image under that tag. New tags (testing builds) still build.
  existing-tag:
    runs-on: ubuntu-24.04
    permissions:
      packages: read
    outputs:
      build: ${{ steps.check.outputs.build }}
    steps:
      - id: check
        shell: bash
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" != push || "$REF_TYPE" != tag ]]; then
            echo build=true >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # publish-branch.yml publishes the tag with '/' replaced by '-'.
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/adguard-home:${REF_NAME//\//-}"
          command -v skopeo >/dev/null || { sudo apt-get update -qq; sudo apt-get install -y skopeo; }
          printf '%s' "$REGISTRY_TOKEN" | skopeo login --username "$GITHUB_ACTOR" --password-stdin ghcr.io
          if inspect="$(skopeo inspect --raw "docker://$image" 2>&1)"; then
            echo "::notice::$image already exists; not rebuilding it for this tag."
            echo build=false >> "$GITHUB_OUTPUT"
          elif grep -q 'manifest unknown' <<<"$inspect"; then
            echo build=true >> "$GITHUB_OUTPUT"
          else
            echo "$inspect" >&2
            exit 1
          fi

  publish-images:
    needs: existing-tag
    if: ${{ needs.existing-tag.outputs.build == 'true' }}
    uses: NethServer/ns8-github-actions/.github/workflows/publish-branch.yml@v1

  module:
    needs: publish-images
    uses: NethServer/ns8-github-actions/.github/workflows/module-info.yml@v1

  qemu:
    # Static: a skipped job shows its name with the matrix expressions
    # unexpanded. The called job adds "<scenario> <distro>".
    name: NS8
    needs: module
    strategy:
      fail-fast: false
      matrix:
        distro: [rocky9, debian13]
        scenario: [install, update]
    # statuses: write lets each leg report continuous-integration/qemu/<distro>-<scenario>.
    permissions:
      contents: read
      statuses: write
    uses: NethServer/ns8-github-actions/.github/workflows/test-on-qemu.yml@v1
    with:
      distro: ${{ matrix.distro }}
      image_url: ${{ needs.module.outputs.image }}
      repo_ref: ${{ needs.module.outputs.sha }}
      version_tag: ${{ needs.module.outputs.tag }}
      artifact_suffix: ${{ matrix.scenario }}
      status_suffix: ${{ matrix.scenario }}
      script: test-module-${{ matrix.scenario }}.sh
      timeout_minutes: 60

  trivy:
    needs: module
    if: ${{ needs.module.outputs.release == 'stable' || needs.module.outputs.release == 'latest' || github.event_name == 'workflow_dispatch' }}
    uses: NethServer/ns8-github-actions/.github/workflows/scan-with-trivy.yml@v1
    with:
      images: ${{ needs.module.outputs.images }}
