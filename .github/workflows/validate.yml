name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check catalog version
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -Eeuo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            .github/scripts/check-catalog-version --base "origin/$BASE_REF"
          elif [[ "$REF_NAME" != "$DEFAULT_BRANCH" ]]; then
            .github/scripts/check-catalog-version --base "origin/$DEFAULT_BRANCH"
          else
            .github/scripts/check-catalog-version
          fi

      - name: Validate Python and JSON
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import ast
          import json
          from pathlib import Path

          errors = []
          ignored = {".git", ".devcontainer", "node_modules", "dist"}

          for path in Path(".").rglob("*"):
              if not path.is_file() or ignored.intersection(path.parts):
                  continue
              try:
                  source = path.read_text(encoding="utf-8")
              except UnicodeDecodeError:
                  continue
              first_line = source.partition("\n")[0]
              if first_line.startswith("#!") and "python" in first_line:
                  try:
                      ast.parse(source, filename=str(path))
                  except SyntaxError as exc:
                      errors.append(f"{path}: {exc}")

          for path in Path(".").rglob("*.json"):
              if ignored.intersection(path.parts):
                  continue
              try:
                  with path.open(encoding="utf-8") as stream:
                      json.load(stream)
              except (OSError, json.JSONDecodeError) as exc:
                  errors.append(f"{path}: {exc}")

          if errors:
              print("\n".join(errors))
              raise SystemExit(1)
          PY

      - name: Validate shell scripts and systemd state paths
        shell: bash
        run: |
          set -Eeuo pipefail
          while IFS= read -r -d '' file; do
            if head -n 1 "$file" | grep -Eq '^#!.*(bash|/sh)([[:space:]]|$)'; then
              bash -n "$file"
            fi
          done < <(find . -type f \
            -not -path './.git/*' \
            -not -path './ui/node_modules/*' \
            -print0)

          if grep -R --line-number --fixed-string '%S/state' imageroot; then
            echo "Legacy %S systemd state path found; use %E on current NS8 systems." >&2
            exit 1
          fi

      - name: Unit tests
        shell: bash
        run: |
          set -Eeuo pipefail
          # Same PyYAML as the NS8 agent environment (pyreq3_13.txt)
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet PyYAML==6.0.3
          "$RUNNER_TEMP/venv/bin/python" -m unittest discover -s tests -p 'test_*.py' -v

  ui:
    name: UI production/dev browser regressions
    runs-on: ubuntu-latest
    env:
      IBM_TELEMETRY_DISABLED: "true"
      NS8_CORE_IMAGE: ghcr.io/nethserver/core:latest@sha256:91f910e7e247d5806ce63abc54914edd59558b0bd7669a2337b678c295f3b5c6
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          # Keep in sync with NODE_IMAGE in build-images.sh
          node-version: "24.22.2"
          cache: yarn
          cache-dependency-path: ui/yarn.lock

      - name: Install dependencies
        run: yarn install --immutable
        working-directory: ui

      - name: Lint
        run: yarn lint
        working-directory: ui

      - name: Build
        run: yarn build
        working-directory: ui

      - name: Build exact production recipe
        run: |
          set -euo pipefail
          podman build --target ui -t localhost/adguard-ui-ci -f ui/Containerfile ui
          id="$(podman create --entrypoint /bin/true localhost/adguard-ui-ci)"
          trap 'podman rm -f "$id" >/dev/null' EXIT
          podman cp "$id:/app/dist/." ui/dist/

      - name: Exercise actual nonroot developer entrypoint and interactive serve
        run: python3 .github/scripts/test-ui-dev.py

      - name: Check stack
        run: yarn test:stack
        working-directory: ui

      - name: Extract published host stylesheet (image is never executed)
        run: |
          set -euo pipefail
          id="$(podman create --entrypoint /bin/true --image-volume=ignore "$NS8_CORE_IMAGE")"
          trap 'podman rm -f "$id" >/dev/null' EXIT
          podman cp "$id:/var/lib/nethserver/cluster/ui/css/core.css" "$RUNNER_TEMP/ns8-core.css"

      - name: Install pinned browser
        run: yarn playwright install --with-deps chromium
        working-directory: ui

      - name: Production browser regression (fixture API, real host CSS)
        run: NS8_CORE_CSS="$RUNNER_TEMP/ns8-core.css" yarn test:e2e
        working-directory: ui

      - name: Development diagnostics (fixture API, real host CSS)
        run: NS8_CORE_CSS="$RUNNER_TEMP/ns8-core.css" yarn test:e2e:dev
        working-directory: ui
