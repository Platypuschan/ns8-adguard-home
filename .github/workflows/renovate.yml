name: Renovate policy

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: renovate-policy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    name: Renovate configuration and behavior
    runs-on: ubuntu-26.04
    container:
      image: ghcr.io/renovatebot/renovate:44.227.1@sha256:c6fca2705f83fc8e3fe6069a3284daba9e98f691cb9327bc4a736730d5a189d9
      # Renovate's nonroot default user cannot write runner file commands.
      options: --user=0
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Validate configuration strictly
        run: renovate-config-validator --strict renovate.json
      - name: Native extraction, package rules and release-version regressions
        run: node .github/scripts/test-renovate.mjs
      - name: Extract actual repository dependencies without updates
        run: renovate --platform=local --dry-run=extract --require-config=required --onboarding=false
